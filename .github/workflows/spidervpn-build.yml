name: Build SpiderVPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Download libv2ray AAR
      run: |
        mkdir -p V2rayNG/app/libs
        TAG="v26.9.30"
        echo "Using tag: $TAG"
        curl -sL -o V2rayNG/app/libs/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"
        ls -lh V2rayNG/app/libs/

    - name: Build Debug APK
      run: |
        cd V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod +x gradlew
        ./gradlew assemblePlaystoreDebug --console=plain

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: ${{ success() }}
      with:
        name: SpiderVPN-APK
        path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
